spring:
  application:
    name: EcomStore

  #Database information
  datasource:
    url: jdbc:postgresql://localhost:5432/springdb
    username: springuser
    password: springpassword

  #ORM configuration
  #Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true